  /api/v1/roles:
    get:
      description: Retrieves all roles configured in the system.
      produces:
      - application/json
      responses:
        "200":
          description: List of roles
          schema:
            items:
              $ref: '#/definitions/model.Role'
            type: array
        "401":
          description: Unauthorized
