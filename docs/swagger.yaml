  /api/v1/users/{id}/roles:
    delete:
      consumes:
      - application/json
      description: Removes a user role mapping.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role revocation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Role revoked successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid ID or request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden by RBAC policy
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal database error
          schema:
            additionalProperties:
              type: string
            type: object
