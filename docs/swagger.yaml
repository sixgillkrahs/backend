      tags:
      - Resources
    put:
      consumes:
      - application/json
      description: Updates the name or description of a resource.
      parameters:
      - description: Resource ID
        in: path
        name: id
        required: true
        type: integer
      - description: Resource update data
        in: body
        name: request
        required: true
