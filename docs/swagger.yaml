          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal database error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Assign User Role
      tags:
      - User Roles
  /healthz:
    get:
      description: Checks PostgreSQL and Redis connection statuses and returns overall
        health status.
      produces:
      - application/json
      responses:
        "200":
          description: healthy status response
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: unhealthy status response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health Check
      tags:
      - General
  /ping:
    get:
      description: returns a simple pong message to verify the server is running.
      produces:
      - application/json
      responses:
        "200":
          description: pong response
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ping Pong
      tags:
      - General
securityDefinitions:
  BearerAuth:
    description: Type "Bearer <your-token>" to authenticate.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
